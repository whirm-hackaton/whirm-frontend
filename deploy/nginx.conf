map $http_origin $vault_registration_allowed {
    default 0;
    "https://app.whirm.dev" 1;
}
limit_req_zone $binary_remote_addr zone=vault_registration:1m rate=6r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /vault-registration/start {
        include /etc/nginx/vault-registration.conf;
        proxy_pass $vault_origin/identity/accounts/register/send-verification-email;
    }

    location = /vault-registration/finish {
        include /etc/nginx/vault-registration.conf;
        proxy_pass $vault_origin/identity/accounts/register/finish;
    }

    location /vault-registration/ {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
