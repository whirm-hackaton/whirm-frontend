# Only encrypted registration data and an authentication verifier belong here.
if ($request_method != POST) { return 405; }
if ($vault_registration_allowed = 0) { return 403; }
if ($args != "") { return 400; }
limit_req zone=vault_registration burst=4 nodelay;
limit_req_status 429;
client_max_body_size 16k;
access_log off;
proxy_cache off;
add_header Cache-Control "no-store" always;
resolver 127.0.0.11 valid=300s ipv6=off;
set $vault_origin https://vault.whirm.dev;
proxy_ssl_server_name on;
proxy_ssl_name vault.whirm.dev;
proxy_ssl_verify on;
proxy_ssl_verify_depth 3;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_set_header Host vault.whirm.dev;
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_set_header Origin https://vault.whirm.dev;
proxy_hide_header Set-Cookie;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_connect_timeout 10s;
proxy_read_timeout 30s;
